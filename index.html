<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Plani</title>
<meta name="theme-color" content="#c56a1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Plani">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="base-reset">
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{-webkit-tap-highlight-color:transparent}
html{background:#f3f2ee}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:#121319}}
html[data-theme="dark"]{background:#121319}
html[data-theme="light"]{background:#f3f2ee}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>La Plani</title>
<meta name="description" content="Tus rutinas de Franco y el registro de cada entrenamiento y cómo te sentiste.">
<style>
/* Layout: app shell — sticky header, scrolling view, fixed bottom tab bar.
   Identity: training logbook — condensed athletic display, chalk/ink neutrals, one amber "esfuerzo" accent. */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --surface-2:#f7f6f2; --elev:#ffffff;
  --border:#e3e0d8; --border-strong:#cfccc2;
  --fg:#1c1d1a; --muted:#6a6a62; --faint:#9a998f;
  --accent:#c56a1b; --accent-weak:#f6e6d4; --accent-ink:#8f4a10;
  --good:#2f8f5b; --good-weak:#dcefe2;
  --warn:#c08a1f; --bad:#c0493f; --bad-weak:#f3ddd9;
  --ring:rgba(197,106,27,.35);
  --shadow:0 1px 2px rgba(20,18,12,.06),0 6px 20px rgba(20,18,12,.05);
  --font-display:"Saira Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --maxw:720px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121319; --surface:#191b22; --surface-2:#1f222b; --elev:#20232d;
  --border:#2c303b; --border-strong:#3a3f4d;
  --fg:#edeef2; --muted:#9aa0ad; --faint:#6c7280;
  --accent:#f0a24a; --accent-weak:#352a1d; --accent-ink:#f3b669;
  --good:#54c98a; --good-weak:#1d2f26; --warn:#e5b24e; --bad:#e8726a; --bad-weak:#33211f;
  --ring:rgba(240,162,74,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121319; --surface:#191b22; --surface-2:#1f222b; --elev:#20232d;
  --border:#2c303b; --border-strong:#3a3f4d;
  --fg:#edeef2; --muted:#9aa0ad; --faint:#6c7280;
  --accent:#f0a24a; --accent-weak:#352a1d; --accent-ink:#f3b669;
  --good:#54c98a; --good-weak:#1d2f26; --warn:#e5b24e; --bad:#e8726a; --bad-weak:#33211f;
  --ring:rgba(240,162,74,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:15px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:.2px;line-height:1.05;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
input,textarea,select,button{font-size:16px}
a{color:var(--accent-ink)}

/* ---- shell ---- */
.app{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:0 clamp(14px,4vw,22px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);
  padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand .logo{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.5px;
  color:var(--fg);line-height:1}
.brand .logo b{color:var(--accent)}
.brand .sub{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;
  display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:19px;height:19px}

main{flex:1;padding-block:16px}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view,.view.active{animation:none}}

/* ---- bottom nav ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;gap:2px}
nav.tabs .wrap{display:flex;width:100%;max-width:var(--maxw);justify-content:space-between}
.tab{flex:1;background:none;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 2px 4px;border-radius:10px;font-size:10.5px;font-weight:600;letter-spacing:.2px}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--accent)}
.tab:active{background:var(--surface-2)}

/* ---- generic ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.section-title{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);margin:22px 2px 10px}
.section-title:first-child{margin-top:4px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-family:var(--font-mono)}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);
  padding:11px 16px;font-weight:600;font-size:14.5px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205}
.btn.primary:disabled{opacity:.5}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.pill.accent{background:var(--accent-weak);color:var(--accent-ink);border-color:transparent}

/* chips (series / rest) */
.exmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;
  border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.rest{background:var(--accent-weak);color:var(--accent-ink);border-color:transparent}
.chip svg{width:11px;height:11px}

/* badges (week status) */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;white-space:nowrap}
.badge.same{background:var(--surface-2);color:var(--muted);border:1px dashed var(--border-strong)}
.badge.adj{background:var(--accent-weak);color:var(--accent-ink)}

select,input[type=text],input[type=number],input[type=date],textarea{
  width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
  color:var(--fg);padding:11px 12px;font-family:inherit;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
textarea{resize:vertical;min-height:72px;line-height:1.45}
label.fld{display:block;margin-bottom:14px}
label.fld>span{display:block;font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--muted);
  text-transform:uppercase;margin-bottom:6px}

/* ---- train ---- */
.selgrid{display:grid;grid-template-columns:1fr;gap:10px}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayhead h2{font-size:24px}
.ctxline{font-size:12px;color:var(--faint);margin:2px 2px 0;text-transform:uppercase;letter-spacing:.6px}
.daynote{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border-strong);
  border-radius:10px;padding:9px 12px;margin-top:8px}

/* exercise item */
.exlist{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.exhdr{font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;font-size:12px;
  color:var(--accent-ink);margin:8px 2px 0}
.ex{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;transition:border-color .15s}
.ex.done{border-color:var(--good);background:var(--good-weak)}
.ex .exrow{display:flex;gap:11px;padding:12px;align-items:flex-start}
.chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border-strong);background:var(--surface);
  display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk svg{width:15px;height:15px;opacity:0;color:#fff}
.ex.done .chk{background:var(--good);border-color:var(--good)}
.ex.done .chk svg{opacity:1}
.ex .extext{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.ex .exlog{padding:0 12px 12px 47px}
.ex .exlog input{padding:8px 10px;font-size:14px}
.ex.done .exlog input{background:var(--surface)}

/* feeling selector */
.feel{display:flex;gap:7px;justify-content:space-between}
.feel button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;
  padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.feel button .emo{font-size:23px;line-height:1}
.feel button .lab{font-size:10px;font-weight:600;letter-spacing:.2px}
.feel button.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}
.feel button:active{transform:scale(.96)}
.rangewrap{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--accent);height:30px}
.rangeval{font-family:var(--font-display);font-size:28px;min-width:44px;text-align:center;color:var(--accent)}

/* ---- routines browser ---- */
.acc{border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:11px;background:var(--surface)}
.acc>summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .chev{margin-left:auto;transition:.2s;color:var(--faint);flex:none}
.acc[open]>summary .chev{transform:rotate(90deg)}
.acc .mname{font-family:var(--font-display);font-size:19px;line-height:1.05}
.acc .mmeta{font-size:12px;color:var(--muted);margin-top:2px}
.acc .body{padding:4px 15px 14px;border-top:1px solid var(--border)}
.wk{margin-top:11px;border-top:1px solid var(--border);padding-top:9px}
.wk:first-child{border-top:0}
.wk>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap}
.wk>summary::-webkit-details-marker{display:none}
.wk .wname{font-weight:700;font-size:14.5px}
.wk .chev{margin-left:auto;color:var(--faint);transition:.2s;flex:none}
.wk[open]>summary .chev{transform:rotate(90deg)}
.coachnote{font-size:12.5px;color:var(--muted);background:var(--accent-weak);border-radius:9px;
  padding:9px 11px;margin:8px 0;border-left:3px solid var(--accent);line-height:1.45}
.coachnote b{color:var(--accent-ink)}
.changenote{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:9px 11px;margin:8px 0;line-height:1.45}
.dayblock{margin:12px 0 4px}
.dayblock .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.dayblock h4{font-size:15px;color:var(--fg)}
.dayblock .dnote{font-size:12px;color:var(--faint);margin-bottom:6px}
.exline{padding:7px 0;border-top:1px dashed var(--border)}
.exline:first-child{border-top:0}
.exline .mv{font-size:13.5px;line-height:1.4}
.exline.hdr{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.8px;font-size:11.5px;color:var(--accent-ink);border-top:0;padding-bottom:0}
.pdfbox{border:1px dashed var(--border-strong);border-radius:11px;padding:13px 14px;color:var(--muted);font-size:13px;line-height:1.5}

/* ---- history ---- */
.logitem{margin-bottom:10px}
.logitem>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:12px}
.logitem>summary::-webkit-details-marker{display:none}
.logitem .face{font-size:24px;flex:none}
.logitem .linfo{flex:1;min-width:0}
.logitem .ltitle{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logitem .ldate{font-size:12px;color:var(--muted)}
.logitem .body{padding:2px 14px 14px;border-top:1px solid var(--border)}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.loglist{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.loglist li{font-size:13px;display:flex;gap:8px;align-items:flex-start}
.loglist li .dot{color:var(--good);flex:none;font-weight:700}
.loglist li .dot.no{color:var(--faint)}
.loglist li .lognote{color:var(--accent-ink);font-weight:600}
.lognotes{font-size:13.5px;background:var(--surface-2);border-radius:9px;padding:10px 12px;margin-top:6px;white-space:pre-wrap}

/* ---- progress ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px}
.tile .big{font-family:var(--font-display);font-size:33px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.tile .big .u{font-size:15px;color:var(--muted)}
.tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:5px}
.chartcard{overflow-x:auto}
.emptyp{text-align:center;color:var(--muted);padding:34px 18px}
.emptyp .em{font-size:40px;margin-bottom:8px}

/* series dots + rest tag */
.ex .extop{padding:12px 12px 0}
.ex .sets{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 12px 0}
.ex .exlog{padding:9px 12px 12px}
.lastref{font-size:11.5px;color:var(--faint);padding:8px 12px 0;line-height:1.35}
.lastref b{color:var(--muted);font-variant-numeric:tabular-nums}
.setdot{width:32px;height:32px;border-radius:9px;border:2px solid var(--border-strong);background:var(--surface);
  display:grid;place-items:center;font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--muted);flex:none}
.setdot.on{background:var(--good);border-color:var(--good);color:#fff}
.setdot:active{transform:scale(.9)}
.resttag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:6px 10px;border-radius:999px;background:var(--accent-weak);color:var(--accent-ink);border:0}
.resttag svg{width:13px;height:13px}
.resttag:active{transform:scale(.95)}

/* editor de rutina */
.dayblock.editing{border:1px solid var(--accent);border-radius:12px;padding:12px;background:var(--surface-2);margin:12px 0}
.editlist{display:flex;flex-direction:column}
.editrow{border-top:1px dashed var(--border-strong);padding:10px 0}
.editrow:first-child{border-top:0}
.editrow-top{display:flex;gap:8px;align-items:center}
.ed-name{flex:1;min-width:0}
.ed-del{background:none;border:0;font-size:17px;flex:none;cursor:pointer;padding:4px}
.editrow-nums{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-top:6px}
.editrow-nums input{padding:8px 9px;font-size:13px}
.editrow-move{display:flex;gap:6px;margin-top:6px}
.editrow-move button{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px;font-size:14px;cursor:pointer;color:var(--muted)}
.editrow-move button:active{transform:scale(.95)}

/* cronómetro de descanso */
.resttimer{position:fixed;left:12px;right:12px;margin:0 auto;max-width:calc(var(--maxw) - 24px);
  bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:11px;
  background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);overflow:hidden}
.resttimer.done{background:var(--good);color:#fff}
.rt-info{flex:1;min-width:0}
.rt-lab{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-time{font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.rt-btn{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px;flex:none}
.rt-btn:active{transform:scale(.95)}
.rt-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width 1s linear}
.resttimer.done .rt-bar{background:rgba(255,255,255,.6);width:100%}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.hr{height:1px;background:var(--border);margin:18px 0}
.spacer{height:10px}
.inline-link{background:none;border:0;color:var(--accent-ink);font-weight:600;padding:0;text-decoration:underline;font-size:inherit;cursor:pointer}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo">LA&nbsp;<b>PLANI</b></span>
      <span class="sub" id="brandsub">Joaco · plancha & front</span>
    </div>
    <button class="iconbtn" id="themebtn" aria-label="Cambiar tema" title="Tema claro/oscuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main>
    <section class="view active" id="v-train"></section>
    <section class="view" id="v-routines"></section>
    <section class="view" id="v-history"></section>
    <section class="view" id="v-progress"></section>
    <section class="view" id="v-data"></section>
  </main>
</div>

<nav class="tabs"><div class="wrap">
  <button class="tab active" data-view="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M4 9l-1.5-1.5a1.5 1.5 0 0 1 0-2.1l.9-.9a1.5 1.5 0 0 1 2.1 0L9 6M15 18l1.5 1.5a1.5 1.5 0 0 0 2.1 0l.9-.9a1.5 1.5 0 0 0 0-2.1L18 15"/></svg>
    Entrenar</button>
  <button class="tab" data-view="routines">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11M4 12h11M4 19h11"/><circle cx="19.5" cy="5" r="1.2" fill="currentColor"/><circle cx="19.5" cy="12" r="1.2" fill="currentColor"/><circle cx="19.5" cy="19" r="1.2" fill="currentColor"/></svg>

/* =========================================================================
   PARSER de ejercicios -> { name, series, reps, rest, header }
   Quita del nombre lo que ya se muestra como chip (no duplicar).
   ========================================================================= */
function isRest(s){
  s=s.trim().replace(/^descanso\s*/i,"");
  if(!/^\d/.test(s)) return false;
  const stripped=s.replace(/\b[aA]\b/g," ").replace(/[\d\s:'"().\-\u2013\u2019]/g,"");
  return stripped.length===0;
}
function cleanRest(s){ return s.trim().replace(/^descanso\s*/i,"").trim(); }
function parseEx(raw){
  let text=String(raw).trim();
  if(/:\s*$/.test(text)) return {name:text, header:true};
  let rest=null, series=null, reps=null, tail="";
  let m=text.match(/\s*\(([^()]*)\)\s*$/);
  if(m && isRest(m[1])){ rest=cleanRest(m[1]); text=text.slice(0,m.index).trim(); }
  else{ m=text.match(/\s+descanso\s+([^()]+?)\s*$/i);
    if(m && isRest("descanso "+m[1])){ rest=cleanRest(m[1]); text=text.slice(0,m.index).trim(); } }
  m=text.match(/\s*(\([^()]*\))\s*$/);
  if(m){ tail=" "+m[1]; text=text.slice(0,m.index).trim(); }
  let s;
  if(s=text.match(/(\d+)\s*series\s*x\s*(\S+)\s*$/i)){ series=+s[1]; reps=s[2]; text=text.slice(0,s.index).trim(); }
  else if(s=text.match(/x?\s?(\d+)\s*series\s*$/i)){ series=+s[1]; text=text.slice(0,s.index).trim(); }
  else if(s=text.match(/x(\d+)\s*$/i)){ series=+s[1]; text=text.slice(0,s.index).trim(); }
  else if(s=text.match(/(\d+)\s*x\s+(\S+)\s*$/)){ series=+s[1]; reps=s[2]; text=text.slice(0,s.index).trim(); }
  const name=(text+tail).replace(/\s{2,}/g," ").replace(/[\s+]+$/,"").trim()||raw.trim();
  return {name, series, reps, rest, header:false};
}

const CLOCK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>`;
function chipsHTML(p){
  let h="";
  if(p.series) h+=`<span class="chip">${p.series} ${p.series===1?"serie":"series"}</span>`;
  if(p.reps) h+=`<span class="chip">\u00d7 ${esc(p.reps)}</span>`;
  if(p.rest) h+=`<span class="chip rest">${CLOCK}${esc(p.rest)} entre series</span>`;
  return h;
}
function parseRestSeconds(rest){
  if(!rest) return 0;
  let m=rest.match(/(\d+)\s*:\s*(\d+)/); if(m) return (+m[1])*60+(+m[2]);
  m=rest.match(/\d+/); return m ? (+m[0])*60 : 0;
}

function normEx(raw){ const p=parseEx(raw); return {name:p.name, series:p.series||null, reps:p.reps||null, rest:p.rest||null, header:!!p.header}; }
function dayItems(mesoId,wi,di,dayObj){ const e=state.edits&&state.edits[mesoId+"|"+wi+"|"+di];
  if(Array.isArray(e)) return e.map(x=>({name:x.name||"", series:(x.series!=null&&x.series!=="")?+x.series:null, reps:x.reps||null, rest:x.rest||null, header:!!x.header}));

function dayEdited(mesoId,wi,di){ return Array.isArray(state.edits&&state.edits[mesoId+"|"+wi+"|"+di]); }

/* logs ordenados del más nuevo al más viejo */
function logsDesc(){ return [...state.logs].sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0))); }
/* nombre limpio de un ejercicio guardado (sirve para logs viejos que guardaban el texto crudo) */
function exName(t){ return parseEx(String(t==null?"":t)).name; }
/* última vez que hiciste ESE ejercicio (por nombre), en cualquier día */
function lastForExercise(name){ for(const l of logsDesc()){ const ex=(l.exercises||[]).find(e=>exName(e.text)===name); if(ex) return {note:ex.note||"", setsDone:ex.setsDone!=null?ex.setsDone:(ex.done?ex.series:0), series:ex.series, date:l.date}; } return null; }
/* última sesión de ese mismo día (para precargar RPE/duración) */
function lastForDay(mesoName,dayName){ return logsDesc().find(l=>l.mesoName===mesoName&&l.dayName===dayName)||null; }

function buildDraft(){

  draft={ mesoName:m.name, weekLabel:w.label, dayName:d.name, dayNote:d.note||"", date:todayISO(),
    exercises:items.map(x=>{ const ns=x.header?0:(x.series||1); const last=x.header?null:lastForExercise(x.name);
      return {name:x.name, header:x.header, reps:x.reps, rest:x.rest, sets:Array(ns).fill(false), note:(last&&last.note)||"", last:last}; }),
    sensacion:0, esfuerzo:(ls?ls.esfuerzo:6), duracion:(ls&&ls.duracion?String(ls.duracion):""), notas:"" };
}

function renderHistory(){

  view.innerHTML=`<div class="section-title" style="margin-top:4px">${logs.length} ${logs.length===1?"entrenamiento":"entrenamientos"}</div>`
  + logs.map(l=>{ const done=l.exercises.filter(e=>e.done).length;

function renderProgress(){
  const view=document.getElementById("v-progress"); const logs=state.logs;
  if(!logs.length){ view.innerHTML=emptyState("📈","Sin datos todavía.","Cuando guardes entrenamientos vas a ver acá tu racha, tu sensación promedio y tu progreso por ejercicio."); return; }
  const now=new Date(), monKey=keyOf(mondayOf(todayISO()));
  const thisWeek=logs.filter(l=>keyOf(mondayOf(l.date))===monKey).length;
  const ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const thisMonth=logs.filter(l=>l.date.slice(0,7)===ym).length;
  const last30=logs.filter(l=>(now-new Date(l.date))/864e5<=30);
  const avgFeel=last30.length?(last30.reduce((s,l)=>s+l.sensacion,0)/last30.length):0;
  const weeks=[]; for(let i=9;i>=0;i--){ const d=mondayOf(todayISO()); d.setDate(d.getDate()-i*7); weeks.push({key:keyOf(d),d:new Date(d),count:0}); }
  logs.forEach(l=>{ const w=weeks.find(x=>x.key===keyOf(mondayOf(l.date))); if(w)w.count++; });
  const maxC=Math.max(1,...weeks.map(w=>w.count));
  view.innerHTML=`
    <div class="tiles">
      <div class="tile"><div class="big">${logs.length}</div><div class="lab">Entrenamientos</div></div>
      <div class="tile"><div class="big">${thisMonth}</div><div class="lab">Este mes</div></div>
      <div class="tile"><div class="big">${thisWeek}</div><div class="lab">Esta semana</div></div>
      <div class="tile"><div class="big">${avgFeel?avgFeel.toFixed(1):"–"}<span class="u"> /5</span></div><div class="lab">Sensación (30 d) ${avgFeel?faceFor(Math.round(avgFeel)):""}</div></div>
    </div>
    <div class="section-title">Sesiones por semana</div>
    <div class="card pad chartcard">${barChart(weeks,maxC)}</div>
    <div class="section-title">Progreso por ejercicio</div>
    <div class="card pad"><label class="fld" style="margin:0"><span>Elegí un ejercicio</span><select id="exPick"></select></label><div id="exTimeline"></div></div>
    <div style="height:6px"></div>`;
  const map=new Map();
  logs.forEach(l=>l.exercises.forEach(e=>{ const key=exName(e.text); if(!map.has(key)) map.set(key,[]); map.get(key).push({date:l.date,note:e.note,done:e.done,feel:l.sensacion,createdAt:l.createdAt}); }));
  const withNotes=[...map.entries()].filter(([_,a])=>a.some(x=>x.note)).map(([t])=>t);
  const options=withNotes.length?withNotes:[...map.keys()];
  const sel=view.querySelector("#exPick");
  sel.innerHTML=options.map((t,i)=>{ const p=parseEx(t); const lbl=p.name.length>52?p.name.slice(0,50)+"…":p.name; return `<option value="${i}">${esc(lbl)}</option>`; }).join("");
  function drawTimeline(){ const t=options[+sel.value];
    const arr=(map.get(t)||[]).sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt));
    view.querySelector("#exTimeline").innerHTML=`<div class="hr"></div>`+(arr.map(x=>`
      <div class="row" style="align-items:flex-start;gap:10px;margin-bottom:9px">
        <span class="mono faint" style="font-size:11.5px;white-space:nowrap;min-width:64px">${esc(fmtDate(x.date))}</span>
        <span style="flex:1;font-size:13.5px">${x.note?esc(x.note):'<span class="faint">— sin nota —</span>'} ${x.done?"":'<span class="faint">(no hecho)</span>'}</span>
        <span>${faceFor(x.feel)}</span></div>`).join("")||'<p class="muted">Sin registros.</p>'); }
  sel.onchange=drawTimeline; drawTimeline();
}
function barChart(weeks,maxC){
  const W=Math.max(320,weeks.length*46),H=150,pad=22,bw=26;
  const bars=weeks.map((w,i)=>{ const x=pad+i*((W-pad*2)/weeks.length)+((W-pad*2)/weeks.length-bw)/2;
    const h=(H-pad*2)*(w.count/maxC), y=H-pad-h, lbl=w.d.toLocaleDateString("es-AR",{day:"numeric",month:"numeric"});
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(h,w.count?3:0).toFixed(1)}" rx="5" fill="${w.count?"var(--accent)":"var(--border-strong)"}"></rect>
      ${w.count?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fg)" font-family="var(--font-mono)">${w.count}</text>`:""}
      <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">${lbl}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:none"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)" stroke-width="1"/>${bars}</svg>`;
}

/* =========================================================================
   CRONÓMETRO DE DESCANSO
   Cuenta regresiva del descanso entre series. Arranca solo al marcar una serie
   (si el ejercicio tiene descanso) o tocando el chip ⏱. Avisa con sonido+vibración.
   ========================================================================= */
let timer=null, AC=null;
function ensureAudio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} }
function beep(){ try{ if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
  o.type="sine"; g.gain.value=.001; const t=AC.currentTime;
  g.gain.exponentialRampToValueAtTime(.18,t+.02); o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1175,t+.16);
  g.gain.exponentialRampToValueAtTime(.001,t+.5); o.start(t); o.stop(t+.52);
}catch(e){} }
function vibrate(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
function fmtClock(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function renderTimer(){ if(!timer) return; const el=document.getElementById("resttimer"); el.hidden=false;
  document.getElementById("rtTime").textContent=fmtClock(timer.left);
  document.getElementById("rtLab").textContent=timer.done?("¡Dale! "+timer.label):("Descanso · "+timer.label);
  document.getElementById("rtBar").style.width=(timer.total?Math.min(100,(1-timer.left/timer.total)*100):0)+"%";
  el.classList.toggle("done",!!timer.done); }
function startRest(seconds,label){
  if(!seconds){ return; } ensureAudio(); stopRest();
  timer={total:seconds,left:seconds,label:(label||"").slice(0,42),done:false};
  renderTimer();
  timer.iv=setInterval(()=>{ timer.left--; if(timer.left<=0 && !timer.done){ timer.left=0; timer.done=true; clearInterval(timer.iv); beep(); vibrate([160,90,160]); }
    renderTimer(); if(timer.done){ setTimeout(stopRest,4000); } },1000);
}
function stopRest(){ if(timer&&timer.iv) clearInterval(timer.iv); timer=null; const el=document.getElementById("resttimer"); if(el) el.hidden=true; }
function bindTimer(){
  document.getElementById("rtAdd").onclick=()=>{ if(!timer) return; ensureAudio(); timer.left+=30; timer.total+=30; timer.done=false; clearInterval(timer.iv);
    timer.iv=setInterval(()=>{ timer.left--; if(timer.left<=0 && !timer.done){ timer.left=0; timer.done=true; clearInterval(timer.iv); beep(); vibrate([160,90,160]); } renderTimer(); if(timer.done){ setTimeout(stopRest,4000); } },1000); renderTimer(); };
  document.getElementById("rtSkip").onclick=stopRest;
}

/* =========================================================================
   SINCRONIZACIÓN EN LA NUBE (Supabase, opcional)
   localStorage sigue siendo la base. Esto baja + fusiona y sube cuando hay
   internet y está configurado. Fusión por id de entrenamiento + tombstones
   para que los borrados también se propaguen. Solo funciona en la app alojada
   (no dentro del preview de claude.ai, que bloquea las llamadas externas).
   ========================================================================= */
function genCode(){ try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }
function fmtAgo(ts){ if(!ts) return "nunca"; const s=Math.round((Date.now()-ts)/1000);
  if(s<45) return "recién"; if(s<90) return "hace 1 min"; const m=Math.round(s/60);
  if(m<60) return "hace "+m+" min"; const h=Math.round(m/60); if(h<24) return "hace "+h+" h"; return "hace "+Math.round(h/24)+" d"; }
function syncConfigured(){ const c=state.prefs.sync; return !!(c&&c.url&&c.key&&c.code); }
function maybeSync(){ if(!syncConfigured()) return; if(typeof navigator!=="undefined"&&navigator.onLine===false) return;
  syncNow().then(res=>{ if(res&&res.ok){ renderers[current]&&renderers[current](); } }); }
async function syncNow(){
  const c=state.prefs.sync; if(!syncConfigured()) return {ok:false,err:"no configurado"};
  const base=c.url.replace(/\/+$/,"")+"/rest/v1/sync";
  const h={apikey:c.key,"Authorization":"Bearer "+c.key,"Content-Type":"application/json"};
  try{
    const r=await fetch(base+"?select=data&code=eq."+encodeURIComponent(c.code),{headers:h});
    if(!r.ok) throw new Error("HTTP "+r.status+" al leer");
    const rows=await r.json(); const remote=(rows[0]&&rows[0].data)||{logs:[],deleted:[]};
    const delSet=new Set([...(state.deleted||[]),...(remote.deleted||[])]);
    const map=new Map();
    for(const l of [...(remote.logs||[]),...state.logs]){ if(!l||!l.id||delSet.has(l.id)) continue;
      const ex=map.get(l.id); if(!ex||(l.createdAt||0)>=(ex.createdAt||0)) map.set(l.id,l); }
    const merged=[...map.values()];
    const mergedEdits=Object.assign({},remote.edits||{},state.edits||{});
    state.logs=merged; state.deleted=[...delSet]; state.edits=mergedEdits; save();
    const body=JSON.stringify([{code:c.code,data:{logs:merged,deleted:[...delSet],edits:mergedEdits},updated_at:new Date().toISOString()}]);
    const w=await fetch(base+"?on_conflict=code",{method:"POST",headers:Object.assign({"Prefer":"resolution=merge-duplicates,return=minimal"},h),body:body});
    if(!w.ok) throw new Error("HTTP "+w.status+" al guardar");
    state.prefs.sync.lastSync=Date.now(); state.prefs.sync.lastErr=null; save();
    return {ok:true,n:merged.length};
  }catch(e){ if(state.prefs.sync){ state.prefs.sync.lastErr=(e&&e.message)||"error"; save(); } return {ok:false,err:(e&&e.message)||"error"}; }
}
